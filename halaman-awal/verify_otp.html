<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - RINFIS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Font Inter & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex items-center justify-center transition-colors duration-300">

    <div class="max-w-md w-full mx-4 bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-800 p-8">
        
        <!-- Header / Ikon -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 mb-4 text-2xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Verifikasi Kode OTP</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">
                Masukkan 6 digit kode verifikasi yang telah dikirimkan ke email atau nomor WhatsApp Anda. <br>
                <span class="text-xs text-indigo-500 font-medium">(Simulasi: Gunakan kode <b>123456</b>)</span>
            </p>
        </div>

        <!-- Form OTP -->
        <form id="otp-form" class="space-y-6">
            <!-- Kotak Input OTP dengan atribut data-index -->
            <div class="flex justify-between gap-2" id="otp-container">
                <input type="text" maxlength="1" data-index="0" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 dark:focus:ring-indigo-400 dark:focus:border-indigo-400 outline-none transition-all" required>
                <input type="text" maxlength="1" data-index="1" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 dark:focus:ring-indigo-400 dark:focus:border-indigo-400 outline-none transition-all" required>
                <input type="text" maxlength="1" data-index="2" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 dark:focus:ring-indigo-400 dark:focus:border-indigo-400 outline-none transition-all" required>
                <input type="text" maxlength="1" data-index="3" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 dark:focus:ring-indigo-400 dark:focus:border-indigo-400 outline-none transition-all" required>
                <input type="text" maxlength="1" data-index="4" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 dark:focus:ring-indigo-400 dark:focus:border-indigo-400 outline-none transition-all" required>
                <input type="text" maxlength="1" data-index="5" class="otp-input w-12 h-12 text-center text-xl font-bold bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 dark:focus:ring-indigo-400 dark:focus:border-indigo-400 outline-none transition-all" required>
            </div>

            <!-- Pesan Status Error/Success -->
            <div id="status-message" class="text-center text-sm font-medium hidden"></div>

            <!-- Tombol Verifikasi -->
            <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/20 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 dark:focus:ring-offset-slate-900 transition-all">
                Verifikasi Sekarang
            </button>
        </form>

        <!-- Opsi Kirim Ulang -->
        <div class="text-center mt-6 text-sm text-slate-500 dark:text-slate-400">
            Tidak menerima kode? 
            <a href="#" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Kirim Ulang</a>
        </div>
        
    </div>

    <!-- Skrip JavaScript untuk Navigasi & Validasi Warna OTP -->
    <script>
        const inputs = document.querySelectorAll('.otp-input');
        const form = document.getElementById('otp-form');
        const statusMessage = document.getElementById('status-message');

        inputs.forEach((input, index) => {
            // Event saat mengetik
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value.length > 1) {
                    e.target.value = value.charAt(value.length - 1);
                }

                // Reset status warna ketika user mengubah ketikan
                resetInputStyles();

                // Jika terisi, pindah ke input berikutnya
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Event saat tombol keyboard ditekan (untuk tombol Backspace)
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    resetInputStyles();
                    if (input.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    } else {
                        input.value = '';
                    }
                }
            });
        });

        // Fungsi untuk mereset border dan status
        function resetInputStyles() {
            inputs.forEach(input => {
                input.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-600', 'dark:bg-emerald-950/30', 'border-rose-500', 'bg-rose-50', 'text-rose-600', 'dark:bg-rose-950/30');
            });
            statusMessage.classList.add('hidden');
        }

        // Simulasi Pengecekan saat Tombol Submit Ditekan
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Gabungkan semua nilai input
            let otpValue = '';
            inputs.forEach(input => {
                otpValue += input.value;
            });

            // Kode benar diset ke "123456"
            const correctCode = "123456";

            if (otpValue === correctCode) {
                // Jika BENAR (Hijau + Ceklis)
                inputs.forEach(input => {
                    input.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-600', 'dark:bg-emerald-950/30');
                });
                statusMessage.textContent = "✓ Kode OTP benar! Mengalihkan ke dashboard...";
                statusMessage.className = "text-center text-sm font-medium text-emerald-600 dark:text-emerald-400";
                statusMessage.classList.remove('hidden');

                // Redirect otomatis ke dashboard_pengguna.html setelah 1.5 detik
                setTimeout(() => {
                    window.location.href = "dashboard_pengguna.html";
                }, 1500);

            } else {
                // Jika SALAH (Merah)
                inputs.forEach(input => {
                    input.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-600', 'dark:bg-rose-950/30');
                });
                statusMessage.textContent = "✕ Kode OTP salah! Silakan coba lagi. (Gunakan: 123456)";
                statusMessage.className = "text-center text-sm font-medium text-rose-600 dark:text-rose-400";
                statusMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id" class="light" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Sandi Baru - RINFIS Kasir Modern</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-white dark:from-slate-950 dark:via-slate-900 dark:to-slate-900 text-slate-800 dark:text-slate-100 antialiased min-h-screen flex items-center justify-center p-4 sm:p-6 transition-colors duration-300">

    <!-- Container Utama -->
    <div class="w-full max-w-md bg-white/85 dark:bg-slate-900/90 backdrop-blur-xl border border-indigo-100 dark:border-slate-800 shadow-2xl shadow-indigo-100/50 dark:shadow-none rounded-3xl p-8 sm:p-10 relative overflow-hidden transition-all duration-500">
        
        <!-- Efek Cahaya Estetik di Latar Belakang Card -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-400/20 dark:bg-purple-900/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-indigo-400/20 dark:bg-indigo-900/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Logo & Judul -->
        <div class="text-center mb-8 relative z-10">
            <a href="index.html" class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 shadow-lg shadow-indigo-200/50 dark:shadow-none mb-4 hover:scale-105 transition-transform overflow-hidden p-2">
                <img src="rinfisunguawal.png" alt="Logo RINFIS" class="w-full h-full object-contain">
            </a>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Atur Sandi Baru</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed">Silakan masukkan kata sandi baru untuk akunmu. Pastikan kata sandimu kuat.</p>
        </div>

        <!-- Form Reset Password -->
        <form id="resetForm" onsubmit="handleResetSubmit(event)" class="space-y-4 relative z-10">
            
            <!-- Input Sandi Baru -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Kata Sandi Baru</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 dark:text-slate-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="newPassword" required placeholder="Minimal 6 karakter" class="w-full pl-11 pr-12 py-3.5 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition">
                    <button type="button" onclick="togglePassword('newPassword', 'eye-icon-1')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 focus:outline-none">
                        <i id="eye-icon-1" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Input Konfirmasi Sandi Baru -->
            <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Konfirmasi Kata Sandi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 dark:text-slate-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="confirmPassword" required placeholder="Masukkan ulang sandi baru" class="w-full pl-11 pr-12 py-3.5 rounded-xl bg-indigo-50/40 dark:bg-slate-800 border border-indigo-100 dark:border-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white dark:focus:bg-slate-800 transition">
                    <button type="button" onclick="togglePassword('confirmPassword', 'eye-icon-2')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 focus:outline-none">
                        <i id="eye-icon-2" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Tombol Aksi Utama -->
            <button type="submit" id="submit-btn" class="w-full mt-2 py-4 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-200 dark:shadow-none transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center space-x-2">
                <span id="btn-text">Simpan Sandi Baru</span>
                <i id="btn-icon" class="fa-solid fa-check text-xs"></i>
            </button>
        </form>

        <!-- Pesan Notifikasi (Sukses/Error) -->
        <div id="alert-message" class="hidden mt-4 p-4 rounded-xl text-xs text-center font-medium relative z-10 transition-all"></div>

        <!-- Footer / Kembali ke Halaman Login -->
        <div class="mt-8 text-center relative z-10 border-t border-indigo-50 dark:border-slate-800 pt-6">
            <a href="login.html" class="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Halaman Masuk
            </a>
        </div>
    </div>

    <!-- Script Interaktif -->
    <script>
        function togglePassword(fieldId, iconId) {
            const passwordInput = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(iconId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function handleResetSubmit(event) {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertMessage = document.getElementById('alert-message');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');

            // Validasi panjang sandi
            if (newPassword.length < 6) {
                alertMessage.className = "mt-4 p-4 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs text-center font-medium relative z-10";
                alertMessage.textContent = 'Kata sandi minimal harus 6 karakter!';
                alertMessage.classList.remove('hidden');
                return;
            }

            // Validasi kesesuaian sandi
            if (newPassword !== confirmPassword) {
                alertMessage.className = "mt-4 p-4 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs text-center font-medium relative z-10";
                alertMessage.textContent = 'Konfirmasi kata sandi tidak cocok!';
                alertMessage.classList.remove('hidden');
                return;
            }

            // Status Loading
            submitBtn.disabled = true;
            btnIcon.className = "fa-solid fa-circle-notch fa-spin text-xs";
            btnText.textContent = "Menyimpan...";

            setTimeout(() => {
                // Tampilkan sukses
                alertMessage.className = "mt-4 p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs text-center font-medium relative z-10";
                alertMessage.textContent = 'Kata sandi berhasil diubah! Mengarahkan ke halaman login...';
                alertMessage.classList.remove('hidden');

                // Arahkan ke halaman login setelah 2 detik
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }, 1000);
        }
    </script>
</body>
</html>
